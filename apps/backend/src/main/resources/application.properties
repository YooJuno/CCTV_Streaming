# Server configuration
server.port=8081

# HLS file output directory (absolute path or relative to apps/backend)
hls.path=./hls
# Allowed origin patterns for HLS static files (comma-separated)
# Keep defaults strict. Add remote origins explicitly via HLS_ALLOWED_ORIGINS when needed.
hls.allowed-origins=${HLS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174,https://localhost:5174,https://127.0.0.1:5174}
hls.allowed-methods=GET,HEAD,OPTIONS

# Allowed origin patterns for API CORS
# Keep defaults strict. Add remote origins explicitly via API_ALLOWED_ORIGINS when needed.
api.allowed-origins=${API_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174,https://localhost:5174,https://127.0.0.1:5174}
api.allowed-methods=GET,POST,PUT,OPTIONS

# Auth (required in runtime env)
auth.jwt.secret=${AUTH_JWT_SECRET:}
auth.jwt.expiration-seconds=${AUTH_JWT_EXPIRATION_SECONDS:3600}
auth.jwt.cookie-name=${AUTH_JWT_COOKIE_NAME:CCTV_AUTH}
auth.jwt.cookie-secure=${AUTH_JWT_COOKIE_SECURE:false}
auth.jwt.cookie-same-site=${AUTH_JWT_COOKIE_SAME_SITE:Lax}
auth.users=${AUTH_USERS:}
# Brute-force guard for POST /api/auth/login (counted per username + client address)
auth.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:10}
auth.login.lockout-seconds=${AUTH_LOGIN_LOCKOUT_SECONDS:300}
auth.login.max-attempts-per-ip=${AUTH_LOGIN_MAX_ATTEMPTS_PER_IP:50}
auth.login.max-tracked-entries=${AUTH_LOGIN_MAX_TRACKED_ENTRIES:10000}

# Stream catalog (streamId:displayName;...)
streams.catalog=${STREAMS_CATALOG:mystream:Main Entrance}
streams.live-threshold-seconds=${STREAMS_LIVE_THRESHOLD_SECONDS:12}
streams.live-min-segments=${STREAMS_LIVE_MIN_SEGMENTS:2}
streams.health-poll-ms=${STREAMS_HEALTH_POLL_MS:4000}

# Device-initiated MJPEG uploads and camera profiles
devices.registry-path=${DEVICE_REGISTRY_PATH:./device-registry.properties}
devices.pending-token-ttl-seconds=${DEVICE_PENDING_TOKEN_TTL_SECONDS:0}
devices.ingest-public-base-url=${DEVICE_INGEST_PUBLIC_BASE_URL:}
devices.ffmpeg-bin=${FFMPEG_BIN:ffmpeg}
devices.max-concurrent-ingests=${DEVICE_MAX_CONCURRENT_INGESTS:8}
devices.max-frame-bytes=${DEVICE_MAX_FRAME_BYTES:2097152}
devices.max-inter-frame-padding-bytes=${DEVICE_MAX_INTER_FRAME_PADDING_BYTES:65536}
devices.hls-time-seconds=${DEVICE_HLS_TIME_SECONDS:2}
devices.process-exit-timeout-seconds=${DEVICE_PROCESS_EXIT_TIMEOUT_SECONDS:5}
server.tomcat.connection-timeout=${SERVER_TOMCAT_CONNECTION_TIMEOUT:30s}

# Logging
logging.level.root=INFO
devices.max-live-viewers=${DEVICE_MAX_LIVE_VIEWERS:24}
logging.level.com.yoojuno.cctv=INFO
logging.level.org.springframework.web=${WEB_LOG_LEVEL:INFO}
