[platformio]
src_dir = .

[env:esp32cam]
platform = espressif32@6.12.0
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200
board_build.psram = enabled

[env:esp32cam_factory]
extends = env:esp32cam
build_flags = -DCCTV_FACTORY_BUILD=1
extra_scripts = post:package_firmware.py
